name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # `contents: write` creates the GitHub release. `id-token: write` signs
      # the provenance statement of the package.
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # A tag that does not match the manifest publishes a version that no
      # release note describes. Stop before the publication, not after it.
      - name: Check that the tag matches the version of the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "The tag is $GITHUB_REF_NAME and the version is $version." >&2
            exit 1
          fi

      - name: Verify project
        run: npm run check

      - name: Publish package
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run:
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME"
          --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
