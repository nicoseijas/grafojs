version: 2

updates:
  # The package has no runtime dependency, so every update here is a
  # development tool. One group thus gives one pull request each month.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      development:
        patterns: ["*"]
    ignore:
      # TypeScript 7 does not install: `typescript-eslint` declares the peer
      # range `>=4.8.4 <6.1.0`, so `npm ci` stops with a conflict on every
      # platform of the matrix. A pull request for that version thus stays red
      # until `typescript-eslint` accepts the new major version. Remove this
      # entry then, and take the update in one step.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # A workflow that pins an action to a major version still needs an update
  # when the action gets a new major version.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
